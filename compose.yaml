services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corte_fino}
      POSTGRES_USER: ${POSTGRES_USER:-corte_fino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corte_fino_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corte_fino}:${POSTGRES_PASSWORD:-corte_fino_dev_password}@db:5432/${POSTGRES_DB:-corte_fino}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-antes-de-publicar}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - api_generated:/app/generated
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  web:
    build:
      context: ./web
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  api_node_modules:
  api_generated:
  web_node_modules:
